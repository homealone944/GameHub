<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots & Boxes | GameHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='logo-grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff6b6b'/%3E%3Cstop offset='100%25' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' font-weight='900' font-size='60' fill='url(%23logo-grad)'%3EGH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 
    SLIM STANDARD: 
    Individual games only provide their logic mount. 
    The shared Shell (Header, Status Bar, Controls) is injected by lobby-shell.js
  -->
  <div id="game-mount">
    
    <!-- Premium Multi-Item Status Bar (Hoisted by framework) -->
    <div id="game-status-bar" class="status-bar-premium">
        <div class="status-item">
          <div class="status-label">STATUS</div>
          <div id="turn-indicator" class="status-value highlight" style="font-size: 1rem; font-weight: 800;">STARTING...</div>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <div id="label-p1" class="status-label">P1 SCORE</div>
          <div id="score-p1" class="status-value" style="color: #3b82f6; font-weight: 800;">0</div>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <div id="label-p2" class="status-label">P2 SCORE</div>
          <div id="score-p2" class="status-value" style="color: #ef4444; font-weight: 800;">0</div>
        </div>
    </div>

    <!-- The actual game board container -->
    <div class="dab-wrapper">
       <div id="board" class="dab-board">
          <!-- DOTS and LINES via JS -->
       </div>
    </div>
  </div>

  <script src="../../js/notify.js"></script>
  <script src="../../js/lobby-shell.js" type="module"></script>
  <script src="game.js" type="module"></script>
</body>
</html>
