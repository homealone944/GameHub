<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots & Boxes | GameHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 
    SLIM STANDARD: 
    Individual games only provide their logic mount. 
    The shared Shell (Header, Status Bar, Controls) is injected by lobby-shell.js
  -->
  <div id="game-mount">
    
    <!-- Premium Multi-Item Status Bar (Hoisted by framework) -->
    <div id="game-status-bar" class="status-bar-premium">
       <div class="status-item">
         <div class="status-label">STATUS</div>
         <div id="turn-indicator" class="status-value highlight" style="font-size: 1.1rem;">P1 TURN</div>
       </div>
       <div class="status-divider"></div>
       <div class="status-item">
         <div class="status-label">P1 SCORE</div>
         <div id="score-p1" class="status-value" style="color: #3b82f6;">0</div>
       </div>
       <div class="status-divider"></div>
       <div class="status-item">
         <div class="status-label">P2 SCORE</div>
         <div id="score-p2" class="status-value" style="color: #ef4444;">0</div>
       </div>
    </div>

    <!-- The actual game board container -->
    <div class="dab-wrapper">
       <div id="board" class="dab-board">
          <!-- DOTS and LINES via JS -->
       </div>
    </div>

    <!-- Settings Modal (Specific to this game) -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content text-left">
        <h2 class="text-gradient">Game Settings</h2>
        <button class="btn-close" id="btn-close-settings">&times;</button>
        
        <div class="settings-group mt-1" style="text-align: center;">
          <label style="color:var(--text-secondary); display:block; margin-bottom:0.5rem;">Grid Size (Dots)</label>
          <div style="display:flex; gap:1rem; align-items:center; justify-content:center;">
            <input type="number" id="input-cols" min="3" max="15" value="5" style="background:var(--bg-secondary); border:1px solid rgba(255,255,255,0.1); color:white; padding:0.5rem; border-radius:8px; width:70px; text-align:center;">
            <span style="color:var(--text-secondary);">×</span>
            <input type="number" id="input-rows" min="3" max="15" value="5" style="background:var(--bg-secondary); border:1px solid rgba(255,255,255,0.1); color:white; padding:0.5rem; border-radius:8px; width:70px; text-align:center;">
          </div>
        </div>

        <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--accent-coral); opacity: 0.8;">
          ⚠️ Changing size will restart the current game.
        </div>

    <!-- Rules Modal (Specific to this game's local logic) -->
    <div id="rules-modal" class="modal hidden">
      <div class="modal-content text-left">
        <h2 class="text-gradient">How to Play</h2>
        <button class="btn-close" id="btn-close-rules">&times;</button>
        
        <div style="margin-top: 1rem; color: var(--text-secondary); line-height: 1.6; font-size: 0.95rem;">
          <ul style="padding-left: 1rem; margin-top: 0.5rem;">
            <li>Players alternate turns joining two adjacent dots with a line.</li>
            <li>Completing a 1x1 Box earns one point and an extra turn!</li>
            <li>The player with the most boxes at the end wins.</li>
          </ul>
        </div>
        <button id="btn-rules-ok" class="btn btn-mint mt-2 w-100">Got it</button>
      </div>
    </div>

  </div>

  <script src="../../js/notify.js"></script>
  <script src="../../js/lobby-shell.js" type="module"></script>
  <script src="game.js"></script>
</body>
</html>
