<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four | GameHub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 
    SLIM STANDARD: 
    Individual games only provide their logic mount. 
    The shared Shell (Header, Status Bar, Controls) is injected by lobby-shell.js
  -->
  <div id="game-mount">
    <div class="board-container" id="board-container">
      <!-- 7 columns to click on for dropping -->
      <div class="click-zones" id="click-zones">
          <div class="click-col" data-col="0"></div>
          <div class="click-col" data-col="1"></div>
          <div class="click-col" data-col="2"></div>
          <div class="click-col" data-col="3"></div>
          <div class="click-col" data-col="4"></div>
          <div class="click-col" data-col="5"></div>
          <div class="click-col" data-col="6"></div>
      </div>
      
      <!-- The visual board -->
      <div class="c4-board" id="board">
        <!-- 6 rows x 7 cols injected via JS -->
      </div>
    </div>
  </div>

  <script src="../../js/notify.js"></script>
  <script src="../../js/lobby-shell.js" type="module"></script>
  <script src="game.js" type="module"></script>
</body>
</html>
