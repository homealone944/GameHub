<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codenames Duet | GameHub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='logo-grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff6b6b'/%3E%3Cstop offset='100%25' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' font-weight='900' font-size='60' fill='url(%23logo-grad)'%3EGH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 
    SLIM STANDARD: 
    Individual games only provide their logic mount. 
    The shared Shell (Header, Status Bar, Controls) is injected by lobby-shell.js
  -->
  <div id="game-mount">
    
    <!-- Custom Status Bar (Codenames uses a multi-item status bar) -->
    <div id="game-status-bar" class="status-bar-premium">
        <div class="status-item">
          <div class="status-label">MISSION STATUS</div>
          <div id="active-player-display" class="status-value text-gradient" style="font-size: 1rem; font-weight: 800;">WAITING...</div>
          <div id="turn-indicator" class="hidden"></div> <!-- Framework uses this but we have a custom one above -->
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <div class="status-label">AGENTS FOUND</div>
          <div class="status-value"><span id="agents-found">0</span> / 15</div>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <div class="status-label">TURNS LEFT</div>
          <div id="turns-dots" class="status-value" style="color: var(--accent-coral);">9</div>
        </div>
        <div class="status-divider"></div>
        <div class="status-item" style="cursor: pointer;" id="btn-open-log" title="View Mission Log">
          <div class="status-label">LOGS</div>
          <div class="status-value" style="font-size: 1.1rem; display: flex; align-items: center; gap: 4px;">📜 <span id="log-count-badge" style="font-size: 0.75rem; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 10px;">0</span></div>
        </div>
    </div>

    <!-- The 5x5 Board -->
    <div class="board" id="board">
      <!-- Generated by game.js -->
    </div>

    <div id="phase-controls" class="phase-ui">
       <!-- Setup: Start Mission -->
       <button id="btn-start-game" class="btn btn-mint" style="padding: 1rem 3rem;">Start Mission</button>

       <!-- Unified Action Bay (Intel & Guessing) -->
       <div id="action-bay" class="action-bay hidden">
          <!-- Intel Phase: Clue Input -->
          <div id="clue-input-area" class="clue-input-container hidden">
             <input type="text" id="clue-word" placeholder="Clue word" maxlength="20">
             <input type="number" id="clue-num" placeholder="#" min="1" max="9">
             <button id="btn-give-clue" class="btn btn-mint" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0.8rem 2rem;">
                Send Intel <span style="font-weight: 900; font-size: 1.2rem; line-height: 1;">›</span>
             </button>
          </div>

          <!-- Guessing Phase: End Turn -->
          <button id="btn-end-turn" class="btn btn-coral hidden" style="padding: 0.8rem 2rem;">End Turn</button>
       </div>
    </div>

    <!-- Mission Logs Modal -->
    <div id="duet-log-modal" class="modal hidden" style="z-index: 10005;">
       <div class="modal-content text-left" style="max-width: 550px; max-height: 85vh; display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.75rem; margin-bottom: 1rem;">
             <h2 class="text-gradient" style="margin: 0; font-size: 1.5rem;">📜 Mission Logs</h2>
             <button class="btn-close" id="btn-close-log" style="position: static;">&times;</button>
          </div>
          <div id="clue-log-modal-body" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; min-height: 150px; max-height: 50vh; padding-right: 4px;">
             <div id="clue-log" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
          </div>
          <button id="btn-log-modal-ok" class="btn btn-mint mt-2 w-100">Close</button>
       </div>
    </div>

  </div>

  <script src="../../js/notify.js"></script>
  <script src="../../js/lobby-shell.js" type="module"></script>
  <script src="game.js" type="module"></script>
</body>
</html>
