<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template | GameHub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../styles/global.css">
  <style>
    /* Specific tweaks for this game template */
    .game-canvas {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      border: 2px dashed rgba(255,255,255,0.1);
      color: var(--text-secondary);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- 
    SLIM STANDARD: 
    Individual games only provide their logic mount. 
    The shared Shell (Header, Status Bar, Controls) is injected by lobby-shell.js
  -->
  <div id="game-mount">
    <!-- Main Game Canvas -->
    <div class="game-canvas">
      Game Content Goes Here
    </div>
  </div>

  <script src="../../js/notify.js"></script>
  <script src="../../js/lobby-shell.js" type="module"></script>
  <script src="game.js" type="module"></script>
</body>
</html>
